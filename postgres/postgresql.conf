# Minimal config for logical replication (CDC via Debezium pgoutput)
listen_addresses = '*'
port = 5432
max_connections = 200

# Logical decoding
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# Guard against replication slot bloat filling the disk (PG13+)
max_slot_wal_keep_size = 2GB

# Logging
log_min_messages = warning
